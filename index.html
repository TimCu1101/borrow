<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設備 QR Code 借還管理系統</title>
  <style>
    body {
      font-family: "Microsoft JhengHei", sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 20px;
      color: #1f2937;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .card {
      background: #ffffff;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    h2 {
      margin-top: 0;
      font-size: 1.2rem;
      color: #1e40af;
      border-bottom: 2px solid #dbeafe;
      padding-bottom: 8px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }
    .form-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    .form-group {
      flex: 1;
      min-width: 180px;
      display: flex;
      flex-direction: column;
    }
    label {
      font-size: 0.9rem;
      font-weight: bold;
      margin-bottom: 4px;
    }
    input {
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 1rem;
    }
    input[readonly] {
      background-color: #e5e7eb;
      color: #374151;
      cursor: not-allowed;
    }
    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-primary { background-color: #2563eb; color: #fff; }
    .btn-borrow  { background-color: #059669; color: #fff; }
    .btn-return  { background-color: #d97706; color: #fff; }
    .btn-logout  { background-color: #6b7280; color: #fff; padding: 8px 14px; font-size: 0.9rem; }
    .disabled-section {
      opacity: 0.55;
      pointer-events: none;
    }
    .status-msg {
      margin-top: 10px;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
      font-size: 0.9rem;
    }
    th, td {
      border: 1px solid #e5e7eb;
      padding: 8px;
      text-align: left;
    }
    th {
      background-color: #dbeafe;
      color: #1e40af;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- 最上方：登入狀態列（點擊按鈕另開分頁登入） -->
    <div class="card">
      <div class="top-bar" id="notLoggedInBar">
        <span>⚠️ 目前尚未登入，請先登入後再進行借還登記。</span>
        <button class="btn-primary" onclick="openLoginTab()">另開分頁登入</button>
      </div>

      <div class="top-bar" id="loggedInBar" style="display: none;">
        <div>
          ✅ 目前登入：<strong id="displayUserName"></strong>
          （帳號：<span id="displayUserId"></span> / 權限：<span id="displayUserRole"></span>）
        </div>
        <button class="btn-logout" onclick="handleLogout()">登出</button>
      </div>
    </div>

    <!-- 中間：設備借還登記區 -->
    <div class="card disabled-section" id="operationCard">
      <h2>📦 設備借還登記</h2>
      <div class="form-row">
        <div class="form-group">
          <label for="operatorName">借閱人 / 歸還人（自動帶入登入者）</label>
          <input type="text" id="operatorName" placeholder="請先於上方登入" readonly />
        </div>
        <div class="form-group">
          <label for="equipmentId">設備編號（可掃描 QR Code）</label>
          <input type="text" id="equipmentId" placeholder="請輸入或掃描設備編號" />
        </div>
      </div>
      <div class="form-row">
        <button class="btn-borrow" onclick="submitEquipmentAction('borrow')">確認借用</button>
        <button class="btn-return" onclick="submitEquipmentAction('return')">確認歸還</button>
      </div>
      <div id="actionMsg" class="status-msg"></div>
    </div>

    <!-- 下方：近期借還紀錄 -->
    <div class="card">
      <h2>📋 近期借還紀錄</h2>
      <table>
        <thead>
          <tr>
            <th>設備編號</th>
            <th>設備名稱</th>
            <th>借用人</th>
            <th>借用時間</th>
            <th>歸還人</th>
            <th>歸還時間</th>
          </tr>
        </thead>
        <tbody id="historyTableBody">
          <tr><td colspan="6">載入中...</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <script>
    // ⚠️ 請換成你的 Google Apps Script 部署網址
    const API_URL = "https://script.google.com/macros/s/AKfycbz22YkMiPQ898V1KmkQ5E3nMhHzQUTUQDG3TbMdE7CmJs42JbDufwyZjwM6XkxiWUXb/exec";
    let currentUser = null;

    // 1. 頁面載入時檢查是否已有登入狀態
    window.addEventListener("DOMContentLoaded", () => {
      syncUserFromStorage();
      loadInitialData();
    });

    // 2. 關鍵：監聽其他分頁對 localStorage 的修改（登入分頁一成功，這裡立刻同步）
    window.addEventListener("storage", (event) => {
      if (event.key === "loggedInUser") {
        syncUserFromStorage();
      }
    });

    // 另開新分頁開啟 login.html
    function openLoginTab() {
      window.open("login.html", "_blank");
    }

    // 從 localStorage 讀取並套用登入者資訊
    function syncUserFromStorage() {
      const saved = localStorage.getItem("loggedInUser");
      if (saved) {
        const user = JSON.parse(saved);
        currentUser = user;
        document.getElementById("notLoggedInBar").style.display = "none";
        document.getElementById("loggedInBar").style.display = "flex";
        document.getElementById("displayUserName").textContent = user.name;
        document.getElementById("displayUserId").textContent = user.user_id;
        document.getElementById("displayUserRole").textContent = user.role;

        // 自動將登入者設為借閱人 / 歸還人
        document.getElementById("operatorName").value = user.name;
        document.getElementById("operationCard").classList.remove("disabled-section");
      } else {
        currentUser = null;
        document.getElementById("notLoggedInBar").style.display = "flex";
        document.getElementById("loggedInBar").style.display = "none";
        document.getElementById("operatorName").value = "";
        document.getElementById("operationCard").classList.add("disabled-section");
      }
    }

    // 登出（所有分頁也會同步登出）
    function handleLogout() {
      localStorage.removeItem("loggedInUser");
      syncUserFromStorage();
    }

    async function callApi(payload) {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify(payload)
      });
      return await response.json();
    }

    // 送出借用或歸還（直接使用 currentUser.name）
    async function submitEquipmentAction(actionType) {
      if (!currentUser) {
        alert("請先登入系統！");
        return;
      }

      const equipmentId = document.getElementById("equipmentId").value.trim();
      const msgEl = document.getElementById("actionMsg");

      if (!equipmentId) {
        msgEl.style.color = "#dc2626";
        msgEl.textContent = "請輸入或掃描設備編號。";
        return;
      }

      msgEl.style.color = "#2563eb";
      msgEl.textContent = "處理中...";

      try {
        const res = await callApi({
          action: actionType,
          id: equipmentId,
          name: currentUser.name
        });

        if (res.success) {
          msgEl.style.color = "#059669";
          msgEl.textContent = `${res.message}（${res.equipmentName} / 操作人：${res.person}）`;
          document.getElementById("equipmentId").value = "";
          loadInitialData();
        } else {
          msgEl.style.color = "#dc2626";
          msgEl.textContent = res.message;
        }
      } catch (err) {
        msgEl.style.color = "#dc2626";
        msgEl.textContent = "操作失敗：" + err.message;
      }
    }

    async function loadInitialData() {
      try {
        const res = await callApi({ action: "getInitialData" });
        if (res.success) {
          renderHistory(res.records);
        }
      } catch (err) {
        console.error("載入紀錄失敗:", err);
      }
    }

    function renderHistory(records) {
      const tbody = document.getElementById("historyTableBody");
      if (!records || records.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6">目前尚無借還紀錄</td></tr>';
        return;
      }
      tbody.innerHTML = records.slice(0, 20).map(r => `
        <tr>
          <td>${r.id}</td>
          <td>${r.equipmentName}</td>
          <td>${r.borrower}</td>
          <td>${r.borrowTime}</td>
          <td>${r.returner || "-"}</td>
          <td>${r.returnTime || "尚未歸還"}</td>
        </tr>
      `).join("");
    }
  </script>
</body>
</html>
